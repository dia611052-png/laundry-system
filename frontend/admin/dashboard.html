<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users &amp; Roles — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0">Users &amp; roles</h2>
          <p class="text-muted" style="margin:0;">Every account in FreshTrack, and a place to add staff or admins.</p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card"><div class="n" id="statCustomers">&mdash;</div><div class="l">Customers</div></div>
        <div class="stat-card"><div class="n" id="statStaff">&mdash;</div><div class="l">Staff</div></div>
        <div class="stat-card"><div class="n" id="statAdmins">&mdash;</div><div class="l">Admins</div></div>
      </div>

      <div class="section-head"><span class="kicker">ADD ACCOUNT</span></div>
      <form class="form-tag wide" id="addUserForm">
        <div class="row2">
          <div>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
        <div class="row2">
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
            <div class="hint">At least 6 characters.</div>
          </div>
          <div>
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="form-msg error" id="errorMsg"></div>
        <div class="form-msg success" id="successMsg"></div>
        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Create account</button>
        </div>
      </form>

      <div class="section-head" style="margin-top:2rem;"><span class="kicker">ALL ACCOUNTS</span></div>
      <div class="table-wrap">
        <table class="table-tag">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
