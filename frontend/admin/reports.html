<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0">Reports</h2>
          <p class="text-muted" style="margin:0;">Order volume by status, and revenue by service.</p>
        </div>
      </div>

      <div class="section-head"><span class="kicker">ORDERS BY STATUS</span></div>
      <div class="tag-grid" id="statusGrid"></div>

      <div class="section-head" style="margin-top:2rem;"><span class="kicker">REVENUE BY SERVICE</span></div>
      <div class="table-wrap">
        <table class="table-tag">
          <thead><tr><th>Service</th><th>Orders</th><th>Revenue</th></tr></thead>
          <tbody id="serviceStatsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/live-updates.js"></script>
  <script src="../assets/js/admin-reports.js"></script>
</body>
</html>
