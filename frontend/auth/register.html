<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <section class="section" style="padding-top:3rem;">
    <div class="container-tag" style="display:flex; justify-content:center;">
      <form class="form-tag" id="registerForm" novalidate>
        <div class="eyebrow-line">NEW CUSTOMER</div>
        <h2>Create an account</h2>
        <p class="text-muted" style="font-size:.9rem;">Staff and administrator accounts are set up by the shop &mdash; see the login page for demo access.</p>

        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required autocomplete="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        <div class="hint">At least 6 characters.</div>

        <div class="form-msg error" id="formMsg"></div>

        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Create account</button>
          <a href="login.html" class="text-muted" style="font-size:.9rem;">Already registered?</a>
        </div>
      </form>
    </div>
  </section>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
