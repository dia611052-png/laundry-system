<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <section class="section" style="padding-top:3rem;">
    <div class="container-tag" style="display:flex; justify-content:center;">
      <form class="form-tag" id="loginForm" novalidate>
        <div class="eyebrow-line">ACCOUNT ACCESS</div>
        <h2>Log in</h2>
        <p class="text-muted" style="font-size:.9rem;">Customers, staff, and administrators all sign in here.</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <div class="form-msg error" id="formMsg"></div>

        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Log in</button>
          <a href="register.html" class="text-muted" style="font-size:.9rem;">Need an account?</a>
        </div>

        <p class="hint" style="margin-top:1.4rem; border-top:1px dashed var(--line-deep); padding-top:1rem;">
          Demo accounts &mdash;<br>
          Customer: customer@freshtrack.test / customer123<br>
          Staff: staff@freshtrack.test / staff123<br>
          Admin: admin@freshtrack.test / admin123
        </p>
      </form>
    </div>
  </section>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
