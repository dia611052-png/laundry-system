<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0" id="welcomeHeading">Welcome back</h2>
          <p class="text-muted" style="margin:0;">Here's where your laundry stands right now.</p>
        </div>
        <a class="btn-tag marigold" href="book.html">Book a new order</a>
      </div>

      <div class="stat-row">
        <div class="stat-card"><div class="n" id="statTotal">&mdash;</div><div class="l">Total orders</div></div>
        <div class="stat-card"><div class="n" id="statActive">&mdash;</div><div class="l">In progress</div></div>
        <div class="stat-card"><div class="n" id="statCompleted">&mdash;</div><div class="l">Completed</div></div>
      </div>

      <div class="section-head">
        <span class="kicker">ACTIVE ORDERS</span>
        <h3 style="font-family:var(--font-display); color:var(--indigo-deep);">In progress</h3>
      </div>

      <div id="activeOrders"></div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/predict.js"></script>
  <script src="../assets/js/live-updates.js"></script>
  <script src="../assets/js/customer-dashboard.js"></script>
</body>
</html>
