<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0">My orders</h2>
          <p class="text-muted" style="margin:0;">Every booking you've made, current and past.</p>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table-tag">
          <thead><tr><th>Order ID</th><th>Service</th><th>Qty</th><th>Booked</th><th>Status</th><th></th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <div class="section-head" style="margin-top:2rem;">
        <span class="kicker">TRACKING DETAIL</span>
        <h3 style="font-family:var(--font-display); color:var(--indigo-deep);" id="trackingHeading">Select an order above to trace its progress</h3>
      </div>

      <div id="trackingDetail">
        <div class="empty-state">
          <h3>No order selected</h3>
          <p>Click "Track" on any row above to see its full status history.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/predict.js"></script>
  <script src="../assets/js/customer-orders.js"></script>
</body>
</html>
