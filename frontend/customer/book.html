<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0">Book a service</h2>
          <p class="text-muted" style="margin:0;">Pick a service and let us know what you're sending in.</p>
        </div>
      </div>

      <form class="form-tag wide" id="bookForm">
        <label for="service_id">Service</label>
        <select id="service_id" name="service_id" required></select>
        <div id="serviceNote" class="hint"></div>

        <div class="row2">
          <div>
            <label for="qty">Quantity</label>
            <input type="number" id="qty" name="qty" min="1" value="1" required>
          </div>
          <div>
            <label for="dropoff">Preferred drop-off date</label>
            <input type="date" id="dropoff" name="dropoff">
          </div>
        </div>

        <label for="notes">Handling notes (optional)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="e.g. separate whites, no fabric softener"></textarea>

        <div class="form-msg error" id="errorMsg"></div>
        <div class="form-msg success" id="successMsg"></div>

        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Submit booking</button>
        </div>
      </form>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/customer-book.js"></script>
</body>
</html>
