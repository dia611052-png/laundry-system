<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dash-shell">
    <div id="app-sidebar"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2 class="mt-0">Order queue</h2>
          <p class="text-muted" style="margin:0;">Move each order forward as it goes through the wash.</p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card"><div class="n" id="statTotal">&mdash;</div><div class="l">Total orders</div></div>
        <div class="stat-card"><div class="n" id="statActive">&mdash;</div><div class="l">In progress</div></div>
        <div class="stat-card"><div class="n" id="statReady">&mdash;</div><div class="l">Ready for pickup</div></div>
      </div>

      <div class="section-head" style="margin-bottom:1rem;"><span class="kicker">FILTER</span></div>
      <div class="flow-strip" style="margin-bottom:1.4rem;" id="filterStrip"></div>

      <div class="table-wrap">
        <table class="table-tag">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Service</th>
              <th>Qty</th>
              <th>Booked</th>
              <th>Status</th>
              <th>Update</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>window.APP_BASE = '../';</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/live-updates.js"></script>
  <script src="../assets/js/staff-dashboard.js"></script>
</body>
</html>
