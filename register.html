<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-nav-current="">

  <header class="tag-nav">
    <div class="container-tag">
      <a class="brand" href="index.html"><span class="punch"></span>FreshTrack</a>
      <nav>
        <a href="index.html" data-nav="home">Home</a>
        <a href="services.html" data-nav="services">Services</a>
      </nav>
      <div class="actions" id="navActions"></div>
    </div>
  </header>

  <section class="section" style="padding-top:3rem;">
    <div class="container-tag" style="display:flex; justify-content:center;">
      <form class="form-tag" id="regForm" novalidate>
        <div class="eyebrow-line" style="font-family:var(--font-tag); font-size:.72rem; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:.6rem;">NEW CUSTOMER</div>
        <h2>Create an account</h2>
        <p class="text-muted" style="font-size:.9rem;">Staff and administrator accounts are set up by the shop — see the
          login page for demo access.</p>

        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
        <div class="hint">At least 6 characters.</div>

        <div class="form-msg error" id="formMsg"></div>

        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Create account</button>
          <a href="login.html" class="text-muted" style="font-size:.9rem;">Already registered?</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="tag-footer">
    <div class="container-tag">
      <span>© 2026 FreshTrack</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("formMsg");

      if (!name || !email || password.length < 6) {
        msg.textContent = "Fill in every field — password needs at least 6 characters.";
        msg.className = "form-msg error show";
        return;
      }
      const result = Auth.register({ name, email, password });
      if (!result.ok) {
        msg.textContent = result.error;
        msg.className = "form-msg error show";
        return;
      }
      window.location.href = "dashboard-customer.html";
    });
  </script>
</body>

</html>
