<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — FreshTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-nav-current="">

  <header class="tag-nav">
    <div class="container-tag">
      <a class="brand" href="index.html"><span class="punch"></span>FreshTrack</a>
      <nav>
        <a href="index.html" data-nav="home">Home</a>
        <a href="services.html" data-nav="services">Services</a>
      </nav>
      <div class="actions" id="navActions"></div>
    </div>
  </header>

  <section class="section" style="padding-top:3rem;">
    <div class="container-tag" style="display:flex; justify-content:center;">
      <form class="form-tag" id="loginForm" novalidate>
        <div class="eyebrow-line" style="font-family:var(--font-tag); font-size:.72rem; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:.6rem;">ACCOUNT ACCESS</div>
        <h2>Log in</h2>
        <p class="text-muted" style="font-size:.9rem;">Customers, staff, and administrators all sign in here.</p>

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <div class="form-msg error" id="formMsg"></div>

        <div class="submit-row">
          <button type="submit" class="btn-tag marigold">Log in</button>
          <a href="register.html" class="text-muted" style="font-size:.9rem;">Need an account?</a>
        </div>

        <p class="hint" style="margin-top:1.4rem; border-top:1px dashed var(--line-deep); padding-top:1rem;">
          Demo accounts —<br>
          Customer: customer@freshtrack.test / customer123<br>
          Staff: staff@freshtrack.test / staff123<br>
          Admin: admin@freshtrack.test / admin123
        </p>
      </form>
    </div>
  </section>

  <footer class="tag-footer">
    <div class="container-tag">
      <span>© 2026 FreshTrack</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("formMsg");
      const result = Auth.login(email, password);
      if (!result.ok) {
        msg.textContent = result.error;
        msg.className = "form-msg error show";
        return;
      }
      const dest = result.user.role === "admin" ? "dashboard-admin.html"
        : result.user.role === "staff" ? "dashboard-staff.html"
          : "dashboard-customer.html";
      window.location.href = dest;
    });
  </script>
</body>

</html>
